<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CLA Evidence Extractor — Demo</title>
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --muted: #9aa4b2;
            --accent: #6ee7b7;
            --glass: rgba(255, 255, 255, 0.04);
            --error: #f87171;
            --success: #34d399;
            --warning: #fbbf24;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg, #071029 0%, #0b1220 60%);
            color: #e6eef6;
            -webkit-font-smoothing: antialiased;
            padding: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 980px
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #06202a;
            font-weight: 700
        }

        h1 {
            margin: 0;
            font-size: 20px
        }

        p.lead {
            margin: 6px 0 0;
            color: var(--muted)
        }

        .card {
            background: linear-gradient(180deg, var(--card), #071428);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 6px 30px rgba(2, 6, 23, 0.6)
        }

        form {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 14px;
            align-items: start
        }

        .left {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 13px
        }

        input[type=text],
        .drop-area {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: var(--glass);
            color: inherit
        }

        .drop-area {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .drop-area:hover {
            border-color: var(--accent);
            background: rgba(110, 231, 183, 0.05);
        }

        .drop-area.dragover {
            border-color: var(--accent);
            background: rgba(110, 231, 183, 0.1);
        }

        .small {
            font-size: 13px;
            color: var(--muted)
        }

        .right {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        button.primary {
            background: linear-gradient(90deg, var(--accent), #60a5fa);
            border: none;
            color: #052022;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button.primary:hover:not([disabled]) {
            opacity: 0.9;
        }

        button.primary[disabled] {
            opacity: 0.6;
            cursor: default
        }

        .out {
            margin-top: 14px;
            background: #041027;
            border-radius: 8px;
            padding: 12px;
            min-height: 140px;
            color: #dff3e7;
            overflow: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 60vh;
        }

        .out.error {
            color: var(--error);
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .out.success {
            color: var(--success);
            background: rgba(52, 211, 153, 0.05);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .meta {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between
        }

        .muted {
            color: var(--muted);
            font-size: 13px
        }

        .spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            animation: spin 900ms linear infinite;
            display: inline-block
        }

        .status {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .status.ready {
            background: rgba(52, 211, 153, 0.1);
            color: var(--success);
        }

        .status.processing {
            background: rgba(251, 191, 36, 0.1);
            color: var(--warning);
        }

        .status.error {
            background: rgba(248, 113, 113, 0.1);
            color: var(--error);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @media (max-width:880px) {
            form {
                grid-template-columns: 1fr
            }

            .right {
                order: 2
            }

            .left {
                order: 1
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">CE</div>
            <div>
                <h1>CLA Evidence Extractor — Demo</h1>
                <p class="lead">Upload a PDF and ask a question. The system returns a structured JSON response with
                    rules and supporting evidence.</p>
            </div>
        </div>

        <div class="card">
            <form id="upload-form" onsubmit="return false">
                <div class="left">
                    <div>
                        <label for="question">Question</label>
                        <input id="question" type="text" value="What are the overtime compensation rules?" />
                    </div>

                    <div>
                        <label for="pdf">PDF (drag & drop or click)</label>
                        <div id="drop" class="drop-area">Drop a PDF here or click to choose</div>
                        <input id="pdf" type="file" accept="application/pdf" style="display:none" />
                        <div class="small muted">The demo posts to <code>/extract/overtime</code> and shows the JSON
                            response.</div>
                    </div>
                </div>

                <div class="right">
                    <div class="meta">
                        <div id="status" class="status ready">Ready</div>
                        <div style="display:flex;gap:8px">
                            <button id="submit" class="primary">Extract</button>
                        </div>
                    </div>

                    <pre id="result" class="out">No response yet</pre>
                    <div style="display:flex;gap:8px;margin-top:8px">
                        <button id="download" class="primary" style="background:#334155" disabled>Download JSON</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // DOM Elements
        const drop = document.getElementById('drop');
        const fileInput = document.getElementById('pdf');
        const submit = document.getElementById('submit');
        const result = document.getElementById('result');
        const questionEl = document.getElementById('question');
        const downloadBtn = document.getElementById('download');
        const statusEl = document.getElementById('status');

        let lastJson = null;

        // Update status display
        function updateStatus(text, type = 'ready') {
            statusEl.textContent = text;
            statusEl.className = `status ${type}`;
        }

        // File validation
        function validateFile(file) {
            if (!file) {
                updateStatus('No file selected', 'error');
                return { valid: false, message: 'Please choose a PDF file first' };
            }

            // Check file type
            if (file.type !== 'application/pdf') {
                updateStatus('Invalid file type', 'error');
                return {
                    valid: false,
                    message: `Invalid file type: ${file.type || 'unknown'}. Please upload a PDF file.`
                };
            }

            // Check file extension
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                updateStatus('Invalid file extension', 'error');
                return {
                    valid: false,
                    message: 'File must have .pdf extension'
                };
            }

            // Check file size (max 10MB)
            const maxSize = 10 * 1024 * 1024; // 10MB
            if (file.size > maxSize) {
                updateStatus('File too large', 'error');
                return {
                    valid: false,
                    message: `File too large (${(file.size / 1024 / 1024).toFixed(2)}MB). Max size: 10MB`
                };
            }

            if (file.size === 0) {
                updateStatus('Empty file', 'error');
                return { valid: false, message: 'File is empty' };
            }

            return { valid: true, message: 'File is valid' };
        }

        // Drag and drop handlers
        drop.addEventListener('click', () => fileInput.click());

        drop.addEventListener('dragover', (e) => {
            e.preventDefault();
            drop.classList.add('dragover');
        });

        drop.addEventListener('dragleave', () => {
            drop.classList.remove('dragover');
        });

        drop.addEventListener('drop', (e) => {
            e.preventDefault();
            drop.classList.remove('dragover');

            if (e.dataTransfer.files && e.dataTransfer.files.length) {
                const file = e.dataTransfer.files[0];
                const validation = validateFile(file);

                if (validation.valid) {
                    fileInput.files = e.dataTransfer.files;
                    drop.textContent = file.name;
                    updateStatus('Ready to extract', 'ready');
                } else {
                    alert(validation.message);
                }
            }
        });

        // File input change handler
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                const file = fileInput.files[0];
                const validation = validateFile(file);

                if (validation.valid) {
                    drop.textContent = file.name;
                    updateStatus('Ready to extract', 'ready');
                } else {
                    fileInput.value = '';
                    drop.textContent = 'Drop a PDF here or click to choose';
                    alert(validation.message);
                }
            }
        });

        // Main extraction function
        async function doExtract() {
            const file = fileInput.files[0];
            const question = questionEl.value || 'What are the overtime compensation rules?';

            // Validate file
            const validation = validateFile(file);
            if (!validation.valid) {
                alert(validation.message);
                return;
            }

            // Update UI
            submit.disabled = true;
            downloadBtn.disabled = true;
            updateStatus('Processing...', 'processing');
            result.textContent = '';
            result.className = 'out';
            lastJson = null;

            // Create form data
            const formData = new FormData();
            formData.append('pdf', file, file.name);
            formData.append('question', question);

            try {
                // Make API request
                const response = await fetch('/extract/overtime', {
                    method: 'POST',
                    body: formData
                });

                const responseText = await response.text();

                if (!response.ok) {
                    // Handle error response
                    let errorMessage = `Error ${response.status}: `;

                    try {
                        const errorJson = JSON.parse(responseText);
                        errorMessage += errorJson.detail || responseText;
                    } catch {
                        errorMessage += responseText;
                    }

                    result.textContent = errorMessage;
                    result.className = 'out error';
                    updateStatus('Error', 'error');
                    return;
                }

                // Parse successful response
                try {
                    const jsonResponse = JSON.parse(responseText);
                    lastJson = jsonResponse;

                    // Format JSON for display
                    result.textContent = JSON.stringify(jsonResponse, null, 2);
                    result.className = 'out success';

                    // Enable download button
                    downloadBtn.disabled = false;

                    // Update status
                    const decision = jsonResponse.decision || 'unknown';
                    const confidence = jsonResponse.confidence || 0;
                    updateStatus(`✓ Done (${decision}, ${(confidence * 100).toFixed(1)}% confidence)`, 'ready');

                } catch (parseError) {
                    // Try to extract JSON from markdown code blocks
                    const jsonRegex = /```(?:json)?\s*([\s\S]*?)```/i;
                    const match = jsonRegex.exec(responseText);

                    if (match && match[1]) {
                        try {
                            const extractedJson = JSON.parse(match[1]);
                            lastJson = extractedJson;
                            result.textContent = JSON.stringify(extractedJson, null, 2);
                            result.className = 'out success';
                            downloadBtn.disabled = false;
                            updateStatus('✓ Done', 'ready');
                        } catch (e) {
                            result.textContent = 'Could not parse JSON from response:\n' + responseText.substring(0, 500);
                            result.className = 'out error';
                            updateStatus('Parse error', 'error');
                        }
                    } else {
                        result.textContent = 'Non-JSON response:\n' + responseText.substring(0, 500);
                        result.className = 'out error';
                        updateStatus('Invalid response', 'error');
                    }
                }

            } catch (networkError) {
                // Handle network errors
                result.textContent = 'Network error: ' + networkError.message;
                result.className = 'out error';
                updateStatus('Network error', 'error');

            } finally {
                // Reset UI
                submit.disabled = false;
            }
        }

        // Download JSON handler
        downloadBtn.addEventListener('click', () => {
            if (!lastJson) return;

            const blob = new Blob([JSON.stringify(lastJson, null, 2)], {
                type: 'application/json'
            });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = url;
            link.download = `extract_${Date.now()}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        // Submit button handler
        submit.addEventListener('click', doExtract);

        // Enter key handler for question input
        questionEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                doExtract();
            }
        });
    </script>
</body>

</html>
