<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CLA Evidence Extractor — Demo</title>
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --muted: #9aa4b2;
            --accent: #6ee7b7;
            --glass: rgba(255, 255, 255, 0.04);
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg, #071029 0%, #0b1220 60%);
            color: #e6eef6;
            -webkit-font-smoothing: antialiased;
            padding: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 980px
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #06202a;
            font-weight: 700
        }

        h1 {
            margin: 0;
            font-size: 20px
        }

        p.lead {
            margin: 6px 0 0;
            color: var(--muted)
        }

        .card {
            background: linear-gradient(180deg, var(--card), #071428);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 6px 30px rgba(2, 6, 23, 0.6)
        }

        form {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 14px;
            align-items: start
        }

        .left {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 13px
        }

        input[type=text],
        .drop-area {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: var(--glass);
            color: inherit
        }

        .drop-area {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-align: center
        }

        .small {
            font-size: 13px;
            color: var(--muted)
        }

        .right {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        button.primary {
            background: linear-gradient(90deg, var(--accent), #60a5fa);
            border: none;
            color: #052022;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer
        }

        button.primary[disabled] {
            opacity: 0.6;
            cursor: default
        }

        .out {
            margin-top: 14px;
            background: #041027;
            border-radius: 8px;
            padding: 12px;
            min-height: 140px;
            color: #dff3e7;
            overflow: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 60vh;
        }

        .meta {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between
        }

        .muted {
            color: var(--muted);
            font-size: 13px
        }

        .spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
            animation: spin 900ms linear infinite;
            display: inline-block
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @media (max-width:880px) {
            form {
                grid-template-columns: 1fr
            }

            .right {
                order: 2
            }

            .left {
                order: 1
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">CE</div>
            <div>
                <h1>CLA Evidence Extractor — Demo</h1>
                <p class="lead">Upload a PDF and ask a question. The system returns a structured JSON response with
                    rules and supporting evidence.</p>
            </div>
        </div>

        <div class="card">
            <form id="upload-form" onsubmit="return false">
                <div class="left">
                    <div>
                        <label for="question">Question</label>
                        <input id="question" type="text" value="What are the overtime compensation rules?" />
                    </div>

                    <div>
                        <label for="pdf">PDF (drag & drop or click)</label>
                        <div id="drop" class="drop-area">Drop a PDF here or click to choose</div>
                        <input id="pdf" type="file" accept="application/pdf" style="display:none" />
                        <div class="small muted">The demo posts to <code>/extract/overtime</code> and shows the JSON
                            response.</div>
                    </div>
                </div>

                <div class="right">
                    <div class="meta">
                        <div class="muted">Ready</div>
                        <div style="display:flex;gap:8px">
                            <button id="submit" class="primary">Extract</button>
                        </div>
                    </div>

                    <pre id="result" class="out">No response yet</pre>
                    <div style="display:flex;gap:8px;margin-top:8px">
                        <button id="download" class="primary" style="background:#334155">Download JSON</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Basic client-side behavior: drag/drop, submit form, show progress and pretty JSON
        const drop = document.getElementById('drop');
        const fileInput = document.getElementById('pdf');
        const submit = document.getElementById('submit');
        const result = document.getElementById('result');
        const questionEl = document.getElementById('question');
        const downloadBtn = document.getElementById('download');

        let lastJson = null;

        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.style.opacity = 0.9; });
        drop.addEventListener('dragleave', () => { drop.style.opacity = 1; });
        drop.addEventListener('drop', (e) => {
            e.preventDefault(); drop.style.opacity = 1;
            if (e.dataTransfer.files && e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                drop.textContent = e.dataTransfer.files[0].name;
            }
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) drop.textContent = fileInput.files[0].name;
        });

        async function doExtract() {
            const f = fileInput.files[0];
            const q = questionEl.value || '';
            if (!f) { alert('Please choose a PDF file first'); return; }

            submit.disabled = true; result.innerHTML = '<span class="spinner"></span> Running...';
            lastJson = null; downloadBtn.disabled = true;

            const fd = new FormData(); fd.append('pdf', f, f.name); fd.append('question', q);
            try {
                const resp = await fetch('/extract/overtime', { method: 'POST', body: fd });
                const text = await resp.text();
                try {
                    const j = JSON.parse(text);
                    lastJson = j;
                    result.textContent = JSON.stringify(j, null, 2);
                    downloadBtn.disabled = false;
                } catch (err) {
                    // Try to extract JSON inside fenced blocks as a fallback (server also tries this)
                    const re = /```(?:json)?\s*([\s\S]*?)```/i;
                    const m = re.exec(text);
                    if (m && m[1]) {
                        try { const j2 = JSON.parse(m[1]); lastJson = j2; result.textContent = JSON.stringify(j2, null, 2); downloadBtn.disabled = false; }
                        catch (e) { result.textContent = 'Non-JSON response:' + '\n' + text.substring(0, 200); }
                    } else {
                        result.textContent = 'Non-JSON response (status ' + resp.status + '):\n' + text.substring(0, 200);
                    }
                }
            } catch (e) { result.textContent = 'Request failed: ' + String(e); }
            finally { submit.disabled = false; }
        }

        submit.addEventListener('click', doExtract);

        downloadBtn.addEventListener('click', () => {
            if (!lastJson) return; const b = new Blob([JSON.stringify(lastJson, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(b); const a = document.createElement('a'); a.href = url; a.download = 'extract.json'; a.click(); URL.revokeObjectURL(url);
        });
    </script>
</body>

</html>
